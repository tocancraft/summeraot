plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}

// Dependência externa: não incorpora o DAOT dentro do SummerAOT.
def daotJar = file('libs/dannys-aot-2.5.0.jar')
if (!daotJar.exists()) {
    throw new GradleException('Insira o arquivo ORIGINAL do DAOT em libs/dannys-aot-2.5.0.jar')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${project.geckolib_version}"
    modImplementation files('libs/dannys-aot-2.5.0.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// OmniShifter original (CC0), incorporado como mod Fabric aninhado.
tasks.named('jar') {
    from('embedded/omnishifter-1.3.0.jar') {
        into 'META-INF/jars'
    }
}
